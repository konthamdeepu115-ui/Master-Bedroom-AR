<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MBR Bedroom AR</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#000}#help{position:fixed;z-index:10;left:12px;right:12px;top:12px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.72);color:#fff;font-size:14px;line-height:1.4;text-align:center}#controls{position:fixed;z-index:11;left:10px;right:10px;bottom:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:10px;padding:10px 13px;background:#fff;color:#111;font-weight:600}</style></head><body><div id="help">Point the camera at the printed MBR plan. When recognized, the 3D bedroom appears over the plan.</div><a-scene mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"><a-assets><a-asset-item id="mbrModel" src="assets/MBR.glb"></a-asset-item></a-assets><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-gltf-model id="model" src="#mbrModel" position="0 0 0.02" rotation="0 0 0" scale="1 1 1"></a-gltf-model></a-entity></a-scene><div id="controls"><button onclick="rotateModel(-15)">⟲ Rotate</button><button onclick="rotateModel(15)">Rotate ⟳</button><button onclick="scaleModel(1.15)">＋ Scale</button><button onclick="scaleModel(0.87)">－ Scale</button></div><script>const model=document.getElementById('model');let rotY=0,s=1;function rotateModel(d){rotY+=d;model.setAttribute('rotation',`0 ${rotY} 0`)}function scaleModel(m){s*=m;model.setAttribute('scale',`${s} ${s} ${s}`)}</script></body></html>
